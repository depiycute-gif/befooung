      - name: Build release APK
        run: gradle assembleRelease --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: ScreenCapture-apk
          path: app/build/outputs/apk/release/app-release.apk

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk ScreenCapture.apk
          gh release create "build-${{ github.run_number }}" ScreenCapture.apk \
            --repo "${{ github.repository }}" \
            --title "ScreenCapture build ${{ github.run_number }}" \
            --notes "Signed release APK (HEVC / native resolution / up to 60fps). Same signing key every build, so this installs as an update over the previous version."
