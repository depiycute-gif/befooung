name: Build ScreenCapture APK

# 이 파일 하나만 저장소의 .github/workflows/build.yml 로 올리면 됩니다.
# push 되면 프로젝트 전체를 생성하고 APK 를 빌드해서 Releases 에 올립니다.
on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Create project files
        run: |
          mkdir -p "$(dirname 'settings.gradle.kts')"
          cat > 'settings.gradle.kts' <<'__SC_EOF__'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "ScreenCapture"
          include(":app")
          __SC_EOF__
          mkdir -p "$(dirname 'build.gradle.kts')"
          cat > 'build.gradle.kts' <<'__SC_EOF__'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          __SC_EOF__
          mkdir -p "$(dirname 'gradle.properties')"
          cat > 'gradle.properties' <<'__SC_EOF__'
          org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          __SC_EOF__
          mkdir -p "$(dirname '.gitignore')"
          cat > '.gitignore' <<'__SC_EOF__'
          .gradle/
          build/
          local.properties
          .idea/
          *.iml
          .DS_Store
          __SC_EOF__
          mkdir -p "$(dirname 'app/build.gradle.kts')"
          cat > 'app/build.gradle.kts' <<'__SC_EOF__'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          
          android {
              namespace = "com.example.screencapture"
              compileSdk = 34
          
              defaultConfig {
                  applicationId = "com.example.screencapture"
                  minSdk = 29
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }
          
              // 배포용 고정 서명키. 이 값으로 계속 빌드해야 업데이트 설치(기존 앱 위에 덮어쓰기)가 된다.
              // 키를 바꾸면 사용자는 기존 앱을 지우고 다시 설치해야 한다.
              signingConfigs {
                  create("release") {
                      storeFile = file("release.keystore")
                      storePassword = "sc_release_pw"
                      keyAlias = "screencapture"
                      keyPassword = "sc_release_pw"
                  }
              }
          
              buildTypes {
                  release {
                      isMinifyEnabled = false
                      signingConfig = signingConfigs.getByName("release")
                  }
              }
          
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          
          dependencies {
              implementation("androidx.core:core-ktx:1.13.1")
              implementation("androidx.activity:activity-ktx:1.9.0")
          }
          __SC_EOF__
          mkdir -p "$(dirname 'app/src/main/AndroidManifest.xml')"
          cat > 'app/src/main/AndroidManifest.xml' <<'__SC_EOF__'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
          
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PROJECTION" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MICROPHONE" />
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
              <uses-permission android:name="android.permission.WAKE_LOCK" />
              <uses-permission android:name="android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS" />
          
              <application
                  android:allowBackup="true"
                  android:label="@string/app_name"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher_round"
                  android:theme="@android:style/Theme.Material.NoActionBar">
          
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
          
                  <service
                      android:name=".CaptureService"
                      android:exported="false"
                      android:foregroundServiceType="mediaProjection|microphone" />
          
                  <service
                      android:name=".FloatingButtonService"
                      android:exported="false" />
              </application>
          </manifest>
          __SC_EOF__
          mkdir -p "$(dirname 'app/src/main/res/values/strings.xml')"
          cat > 'app/src/main/res/values/strings.xml' <<'__SC_EOF__'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">드피녹화</string>
          </resources>
          __SC_EOF__
          mkdir -p "$(dirname 'app/src/main/java/com/example/screencapture/CaptureService.kt')"
          cat > 'app/src/main/java/com/example/screencapture/CaptureService.kt' <<'__SC_EOF__'
          package com.example.screencapture
          
          import android.app.Notification
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.PendingIntent
          import android.app.Service
          import android.content.ContentUris
          import android.content.ContentValues
          import android.content.Context
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.content.pm.ServiceInfo
          import android.content.res.Configuration
          import android.graphics.Bitmap
          import android.graphics.PixelFormat
          import android.hardware.display.DisplayManager
          import android.hardware.display.VirtualDisplay
          import android.media.Image
          import android.media.ImageReader
          import android.media.MediaCodecInfo
          import android.media.MediaCodecList
          import android.media.MediaFormat
          import android.media.MediaRecorder
          import android.media.projection.MediaProjection
          import android.media.projection.MediaProjectionManager
          import android.net.Uri
          import android.os.Build
          import android.os.Environment
          import android.os.Handler
          import android.os.IBinder
          import android.os.Looper
          import android.os.ParcelFileDescriptor
          import android.os.PowerManager
          import android.os.StatFs
          import android.provider.MediaStore
          import android.util.DisplayMetrics
          import android.view.WindowManager
          import androidx.core.app.NotificationCompat
          import androidx.core.content.ContextCompat
          import java.text.SimpleDateFormat
          import java.util.Date
          import java.util.Locale
          import kotlin.math.min
          import kotlin.math.roundToInt
          
          /**
           * MediaProjection 을 쥐고 있는 포그라운드 서비스.
           * - ACTION_RECORD: 최고 화질 녹화 (가능하면 HEVC, 네이티브 해상도, 최대 60fps)
           * - ACTION_SCREENSHOT: 네이티브 해상도 무손실 PNG 한 장 (매번 권한 다이얼로그)
           * - ACTION_QUICK_START / ACTION_QUICK_CAPTURE: 플로팅 버튼용. 한 번만 권한을 받고
           *   캡처 화면을 계속 띄워 둔 채로, 버튼을 누를 때마다 바로 한 장씩 저장한다.
           */
          class CaptureService : Service() {
          
              private val main = Handler(Looper.getMainLooper())
              private var projection: MediaProjection? = null
              private var virtualDisplay: VirtualDisplay? = null
              private var wakeLock: PowerManager.WakeLock? = null
          
              // recording
              private var recorder: MediaRecorder? = null
              private var videoUri: Uri? = null
              private var videoPfd: ParcelFileDescriptor? = null
          
              // screenshot (단발성 + 퀵캡처 공용)
              private var reader: ImageReader? = null
              private var latestImage: Image? = null
              private var quickW = 0
              private var quickH = 0
          
              @Volatile private var mode = Mode.IDLE
              private enum class Mode { IDLE, RECORDING, SCREENSHOT_ONESHOT, QUICK_STANDBY, STOPPING, ERROR }
          
              private class Spec(val width: Int, val height: Int, val dpi: Int, val fps: Int, val mime: String, val bitrate: Int)
          
              override fun onBind(intent: Intent?): IBinder? = null
          
              override fun onCreate() {
                  super.onCreate()
                  // 이전 실행이 프로세스 강제 종료 등으로 비정상 종료됐으면, MediaStore 에
                  // IS_PENDING=1 로 남아 반쯤 쓰인 파일이 있을 수 있다. 다음 실행 시작 시 정리한다.
                  cleanupStalePendingFiles()
              }
          
              private fun cleanupStalePendingFiles() {
                  try {
                      val targets = listOf(
                          MediaStore.Video.Media.EXTERNAL_CONTENT_URI to "Movies/ScreenCapture/",
                          MediaStore.Images.Media.EXTERNAL_CONTENT_URI to "Pictures/ScreenCapture/"
                      )
                      for ((base, relPath) in targets) {
                          val selection = "${MediaStore.MediaColumns.RELATIVE_PATH} = ? AND ${MediaStore.MediaColumns.IS_PENDING} = 1"
                          contentResolver.query(base, arrayOf(MediaStore.MediaColumns._ID), selection, arrayOf(relPath), null)?.use { c ->
                              val idCol = c.getColumnIndexOrThrow(MediaStore.MediaColumns._ID)
                              while (c.moveToNext()) {
                                  runCatching { contentResolver.delete(ContentUris.withAppendedId(base, c.getLong(idCol)), null, null) }
                              }
                          }
                      }
                  } catch (_: Exception) {
                      // 정리 실패는 치명적이지 않으니 무시하고 계속 진행한다.
                  }
              }
          
              /**
               * 화면 회전 대응(베스트 에포트). 녹화 중인 MediaRecorder 의 인코더 해상도는
               * prepare() 시점에 고정돼 있어서 이 함수가 그걸 바꾸지는 못한다. VirtualDisplay 만
               * 새 화면 크기로 리사이즈해서, 회전 후 내용이 심하게 깨지거나 멈추는 것만 완화한다.
               * (진짜 해상도까지 맞추려면 녹화를 끊고 새 파일로 다시 시작해야 하는데, 그러면
               * "기존 기능 유지" 조건과 충돌할 수 있는 큰 변경이라 지금은 넣지 않았다.)
               */
              override fun onConfigurationChanged(newConfig: Configuration) {
                  super.onConfigurationChanged(newConfig)
                  if (mode != Mode.RECORDING && mode != Mode.QUICK_STANDBY) return
                  try {
                      @Suppress("DEPRECATION")
                      val metrics = DisplayMetrics().also {
                          (getSystemService(Context.WINDOW_SERVICE) as WindowManager).defaultDisplay.getRealMetrics(it)
                      }
                      virtualDisplay?.resize(metrics.widthPixels, metrics.heightPixels, metrics.densityDpi)
                  } catch (_: Exception) {
                      // 리사이즈 실패해도 녹화 자체는 계속 두는 게 낫다.
                  }
              }
          
              /**
               * 최근 앱 목록에서 앱을 스와이프로 지워도(= "앱 종료") 녹화는 계속되게 한다.
               * 포그라운드 서비스 + 알림이 떠 있는 한 안드로이드가 이것 때문에 서비스를 죽이지는 않지만,
               * 일부 제조사(삼성/샤오미 등)는 독자적인 "최근 앱 닫으면 종료" 정책을 추가로 걸어 둔다.
               * 이건 기본 아무 것도 하지 않는 것만으로 "종료하지 않겠다"는 의사를 명확히 하는 장치다.
               */
              override fun onTaskRemoved(rootIntent: Intent?) {
                  // 일부러 super.onTaskRemoved() 이후 stopSelf() 를 호출하지 않는다.
                  super.onTaskRemoved(rootIntent)
              }
          
              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  when (intent?.action) {
                      ACTION_RECORD -> {
                          // 동시에 여러 캡처 세션이 뜨지 않게: IDLE 일 때만 새 세션을 받는다.
                          if (mode != Mode.IDLE) { publish(false, "다른 캡처가 진행 중입니다"); return START_NOT_STICKY }
                          if (!hasEnoughStorage()) { publish(false, "저장 공간이 부족합니다 (최소 100MB 필요)"); return START_NOT_STICKY }
                          val mic = intent.getBooleanExtra(EXTRA_MIC, false) &&
                              ContextCompat.checkSelfPermission(this, android.Manifest.permission.RECORD_AUDIO) == PackageManager.PERMISSION_GRANTED
                          mode = Mode.RECORDING
                          goForeground(withMic = mic, stopAction = ACTION_STOP)
                          startRecording(intent, mic)
                      }
                      ACTION_SCREENSHOT -> {
                          if (mode != Mode.IDLE) { publish(false, "다른 캡처가 진행 중입니다"); return START_NOT_STICKY }
                          if (!hasEnoughStorage()) { publish(false, "저장 공간이 부족합니다"); return START_NOT_STICKY }
                          mode = Mode.SCREENSHOT_ONESHOT
                          goForeground(withMic = false, stopAction = ACTION_STOP)
                          takeScreenshot(intent)
                      }
                      ACTION_QUICK_START -> {
                          if (mode != Mode.IDLE) { publish(false, "다른 캡처가 진행 중입니다"); return START_NOT_STICKY }
                          if (!hasEnoughStorage()) { publish(false, "저장 공간이 부족합니다"); return START_NOT_STICKY }
                          mode = Mode.QUICK_STANDBY
                          goForeground(withMic = false, stopAction = ACTION_QUICK_STOP, text = "빠른 캡처 대기 중")
                          startQuickStandby(intent)
                      }
                      ACTION_QUICK_CAPTURE -> {
                          if (mode == Mode.QUICK_STANDBY) {
                              if (hasEnoughStorage()) captureQuickFrame()
                              else publish(false, "저장 공간이 부족해 캡처를 건너뛰었습니다")
                          }
                      }
                      ACTION_QUICK_STOP -> if (mode == Mode.QUICK_STANDBY) stopQuickStandby()
                      ACTION_STOP -> if (mode == Mode.RECORDING || mode == Mode.SCREENSHOT_ONESHOT) stopRecording()
                  }
                  return START_NOT_STICKY
              }
          
              /** 외장 저장소(사진/동영상이 실제로 저장되는 볼륨)에 최소 여유 공간이 있는지 확인한다. */
              private fun hasEnoughStorage(minBytes: Long = 100L * 1024 * 1024): Boolean {
                  return try {
                      val stat = StatFs(Environment.getExternalStorageDirectory().path)
                      stat.availableBytes >= minBytes
                  } catch (_: Exception) {
                      true // 확인 자체가 실패하면 녹화를 막지는 않는다
                  }
              }
          
              // ---------------------------------------------------------------- foreground
          
              private fun goForeground(withMic: Boolean, stopAction: String, text: String = "실행 중") {
                  val nm = getSystemService(NotificationManager::class.java)
                  val channel = NotificationChannel(CHANNEL, "실행 중", NotificationManager.IMPORTANCE_LOW).apply {
                      setShowBadge(false)
                      setSound(null, null)
                      enableVibration(false)
                      lockscreenVisibility = Notification.VISIBILITY_SECRET
                  }
                  nm.createNotificationChannel(channel)
                  val stop = PendingIntent.getService(
                      this, 0, Intent(this, CaptureService::class.java).setAction(stopAction),
                      PendingIntent.FLAG_IMMUTABLE
                  )
                  val n: Notification = NotificationCompat.Builder(this, CHANNEL)
                      .setSmallIcon(android.R.drawable.stat_sys_download_done)
                      .setContentTitle(text)
                      .setOngoing(true)
                      .setSilent(true)
                      .setVisibility(NotificationCompat.VISIBILITY_SECRET)
                      .addAction(0, "중지", stop)
                      .build()
                  var type = ServiceInfo.FOREGROUND_SERVICE_TYPE_MEDIA_PROJECTION
                  if (withMic) type = type or ServiceInfo.FOREGROUND_SERVICE_TYPE_MICROPHONE
                  startForeground(1, n, type)
              }
          
              private fun obtainProjection(intent: Intent): MediaProjection? {
                  val code = intent.getIntExtra(EXTRA_CODE, 0)
                  @Suppress("DEPRECATION")
                  val data: Intent = intent.getParcelableExtra(EXTRA_DATA) ?: return null
                  val mpm = getSystemService(Context.MEDIA_PROJECTION_SERVICE) as MediaProjectionManager
                  val mp = mpm.getMediaProjection(code, data)
                  // Android 14+: createVirtualDisplay 전에 콜백 등록 필수
                  mp.registerCallback(object : MediaProjection.Callback() {
                      override fun onStop() {
                          // OS/사용자가 캡처 권한을 회수한 경우. 자녀보호 잠금이나 보안 화면 전환 등
                          // 외부 요인으로도 여기로 올 수 있다 — 여기서 새 권한을 다시 요청하지 않고
                          // 그냥 현재 모드에 맞게 조용히 정리만 한다.
                          main.post { handleProjectionRevoked() }
                      }
                  }, main)
                  return mp
              }
          
              private fun handleProjectionRevoked() {
                  when (mode) {
                      Mode.RECORDING -> stopRecording()
                      Mode.QUICK_STANDBY -> stopQuickStandby()
                      Mode.SCREENSHOT_ONESHOT -> {
                          mode = Mode.STOPPING
                          cleanup(deleteFile = false)
                          publish(false, "스크린샷 실패: 캡처 권한이 종료됐습니다")
                          stopSelfClean()
                      }
                      else -> {}
                  }
              }
          
              // ---------------------------------------------------------------- spec
          
              @Suppress("DEPRECATION")
              private fun chooseSpec(): Spec {
                  val wm = getSystemService(Context.WINDOW_SERVICE) as WindowManager
                  val metrics = DisplayMetrics()
                  wm.defaultDisplay.getRealMetrics(metrics)
                  val refresh = wm.defaultDisplay.refreshRate.roundToInt()
                  val fps = min(refresh, 60).coerceAtLeast(30)
          
                  val list = MediaCodecList(MediaCodecList.REGULAR_CODECS).codecInfos.filter { it.isEncoder }
                  // 선호 순서: HEVC(같은 비트레이트에서 화질 우수) → AVC. 해상도는 100% → 75% → 50% 순으로 지원되는 첫 조합.
                  for (scale in listOf(1.0, 0.75, 0.5)) {
                      val w = even((metrics.widthPixels * scale).roundToInt())
                      val h = even((metrics.heightPixels * scale).roundToInt())
                      for (mime in listOf(MediaFormat.MIMETYPE_VIDEO_HEVC, MediaFormat.MIMETYPE_VIDEO_AVC)) {
                          for (info in list) {
                              if (!info.supportedTypes.any { it.equals(mime, true) }) continue
                              val vc = info.getCapabilitiesForType(mime).videoCapabilities ?: continue
                              if (!vc.areSizeAndRateSupported(w, h, fps.toDouble())) continue
                              // 픽셀 * fps * 0.25 bit ≈ 1080x2400@60 에서 약 39Mbps, 코덱 상한으로 제한
                              val want = (w.toLong() * h * fps * 0.25).toLong().coerceAtMost(Int.MAX_VALUE.toLong()).toInt()
                              val bitrate = want.coerceIn(vc.bitrateRange.lower, vc.bitrateRange.upper)
                              return Spec(w, h, (metrics.densityDpi * scale).roundToInt(), fps, mime, bitrate)
                          }
                      }
                  }
                  return Spec(even(metrics.widthPixels / 2), even(metrics.heightPixels / 2), metrics.densityDpi / 2, 30,
                      MediaFormat.MIMETYPE_VIDEO_AVC, 8_000_000)
              }
          
              private fun even(v: Int) = v and 1.inv()
          
              // ---------------------------------------------------------------- 화면 꺼짐 방지
              // 화면이 잠기면 OS 가 화면 자체를 그리지 않아서 녹화가 멈추거나 까맣게 나온다.
              // 녹화/퀵캡처가 돌아가는 동안은 화면이 꺼지지 않게(약하게 켜진 채로) 붙잡아 둔다.
          
              @Suppress("DEPRECATION")
              private fun acquireWakeLock() {
                  if (wakeLock?.isHeld == true) return
                  val pm = getSystemService(Context.POWER_SERVICE) as PowerManager
                  wakeLock = pm.newWakeLock(
                      PowerManager.SCREEN_DIM_WAKE_LOCK or PowerManager.ON_AFTER_RELEASE,
                      "ScreenCapture:keepScreenOn"
                  ).apply { setReferenceCounted(false); acquire(12 * 60 * 60 * 1000L) } // 최대 12시간 안전장치
              }
          
              private fun releaseWakeLock() {
                  wakeLock?.let { if (it.isHeld) it.release() }
                  wakeLock = null
              }
          
              // ---------------------------------------------------------------- recording
          
              private fun startRecording(intent: Intent, mic: Boolean) {
                  try {
                      val mp = obtainProjection(intent) ?: throw IllegalStateException("projection 없음")
                      projection = mp
                      val spec = chooseSpec()
          
                      val values = ContentValues().apply {
                          put(MediaStore.Video.Media.DISPLAY_NAME, "Screen_${stamp()}.mp4")
                          put(MediaStore.Video.Media.MIME_TYPE, "video/mp4")
                          put(MediaStore.Video.Media.RELATIVE_PATH, "Movies/ScreenCapture")
                          put(MediaStore.Video.Media.IS_PENDING, 1)
                      }
                      val uri = contentResolver.insert(MediaStore.Video.Media.EXTERNAL_CONTENT_URI, values)
                          ?: throw IllegalStateException("파일 생성 실패")
                      videoUri = uri
                      val pfd = contentResolver.openFileDescriptor(uri, "rw") ?: throw IllegalStateException("파일 열기 실패")
                      videoPfd = pfd
          
                      val r = if (Build.VERSION.SDK_INT >= 31) MediaRecorder(this) else @Suppress("DEPRECATION") MediaRecorder()
                      // 녹화 도중(설정이 끝난 뒤) 인코더가 비동기로 죽는 경우를 잡는다.
                      // 이미 녹화된 분량은 있으니 파일은 지우지 않고 그대로 저장을 시도한다.
                      r.setOnErrorListener { _, what, extra ->
                          main.post {
                              mode = Mode.ERROR
                              publish(false, "녹화 중 오류 발생 (코드 $what/$extra) — 지금까지 녹화된 분량은 저장을 시도합니다")
                              stopRecording()
                          }
                      }
                      if (mic) r.setAudioSource(MediaRecorder.AudioSource.MIC)
                      r.setVideoSource(MediaRecorder.VideoSource.SURFACE)
                      r.setOutputFormat(MediaRecorder.OutputFormat.MPEG_4)
                      r.setVideoEncoder(
                          if (spec.mime == MediaFormat.MIMETYPE_VIDEO_HEVC) MediaRecorder.VideoEncoder.HEVC
                          else MediaRecorder.VideoEncoder.H264
                      )
                      if (mic) {
                          r.setAudioEncoder(MediaRecorder.AudioEncoder.AAC)
                          r.setAudioEncodingBitRate(320_000)
                          r.setAudioSamplingRate(48_000)
                          r.setAudioChannels(2)
                      }
                      r.setVideoSize(spec.width, spec.height)
                      r.setVideoFrameRate(spec.fps)
                      r.setVideoEncodingBitRate(spec.bitrate)
                      r.setOutputFile(pfd.fileDescriptor)
                      r.prepare()
                      recorder = r
          
                      virtualDisplay = mp.createVirtualDisplay(
                          "ScreenCaptureRec", spec.width, spec.height, spec.dpi,
                          DisplayManager.VIRTUAL_DISPLAY_FLAG_AUTO_MIRROR, r.surface, null, null
                      )
                      r.start()
                      acquireWakeLock()
                      val codec = if (spec.mime == MediaFormat.MIMETYPE_VIDEO_HEVC) "HEVC" else "H.264"
                      val pm = getSystemService(Context.POWER_SERVICE) as PowerManager
                      val saverNote = if (pm.isPowerSaveMode) " · 절전모드 중(성능 제한될 수 있음)" else ""
                      publish(true, "녹화 중 (화면 꺼짐 방지 켜짐)  ${spec.width}x${spec.height} · ${spec.fps}fps · $codec · ${spec.bitrate / 1_000_000}Mbps$saverNote")
                  } catch (e: Exception) {
                      cleanup(deleteFile = true)
                      publish(false, "녹화 시작 실패: ${e.message}")
                      stopSelfClean()
                  }
              }
          
              private fun stopRecording() {
                  if (recorder == null && reader == null) {
                      stopSelfClean()
                      return
                  }
                  mode = Mode.STOPPING
                  val hadRecorder = recorder != null
                  var ok = true
                  try {
                      recorder?.stop()
                  } catch (e: RuntimeException) {
                      ok = false // 너무 짧은 녹화 등
                  }
                  cleanup(deleteFile = !ok)
                  if (hadRecorder) publish(false, if (ok) "저장됨: Movies/ScreenCapture" else "녹화를 정상적으로 마무리하지 못해 저장되지 않았습니다 (너무 짧거나 오류 발생)")
                  stopSelfClean()
              }
          
              // ---------------------------------------------------------------- quick capture (floating button)
          
              private fun startQuickStandby(intent: Intent) {
                  try {
                      val mp = obtainProjection(intent) ?: throw IllegalStateException("projection 없음")
                      projection = mp
                      @Suppress("DEPRECATION")
                      val metrics = DisplayMetrics().also {
                          (getSystemService(Context.WINDOW_SERVICE) as WindowManager).defaultDisplay.getRealMetrics(it)
                      }
                      quickW = metrics.widthPixels
                      quickH = metrics.heightPixels
                      val ir = ImageReader.newInstance(quickW, quickH, PixelFormat.RGBA_8888, 3)
                      reader = ir
                      ir.setOnImageAvailableListener({ rd ->
                          val img = rd.acquireLatestImage() ?: return@setOnImageAvailableListener
                          latestImage?.close()
                          latestImage = img
                      }, main)
                      virtualDisplay = mp.createVirtualDisplay(
                          "ScreenCaptureQuick", quickW, quickH, metrics.densityDpi,
                          DisplayManager.VIRTUAL_DISPLAY_FLAG_AUTO_MIRROR, ir.surface, null, null
                      )
                      isQuickActive = true
                      publish(false, "빠른 캡처 버튼 켜짐")
                  } catch (e: Exception) {
                      mode = Mode.IDLE
                      isQuickActive = false
                      cleanup(deleteFile = false)
                      publish(false, "빠른 캡처 시작 실패: ${e.message}")
                      stopSelfClean()
                      FloatingButtonService.stop(this)
                  }
              }
          
              private fun stopQuickStandby() {
                  mode = Mode.IDLE
                  isQuickActive = false
                  cleanup(deleteFile = false)
                  publish(false, "빠른 캡처 버튼 꺼짐")
                  stopSelfClean()
                  FloatingButtonService.stop(this)
              }
          
              /** 이미 떠 있는 캡처 화면에서 최신 프레임 한 장을 바로 저장한다. 새 권한 요청이나 지연이 없다. */
              private fun captureQuickFrame() {
                  val img = latestImage
                  if (img == null) {
                      // 아직 첫 프레임이 안 왔으면 잠깐만 기다렸다가 한 번 더 시도
                      main.postDelayed({
                          if (mode == Mode.QUICK_STANDBY) saveImage(latestImage, quickW, quickH, keepAlive = true)
                      }, 150)
                      return
                  }
                  saveImage(img, quickW, quickH, keepAlive = true)
              }
          
              private fun cleanup(deleteFile: Boolean) {
                  releaseWakeLock()
                  try { recorder?.release() } catch (_: Exception) {}
                  recorder = null
                  virtualDisplay?.release(); virtualDisplay = null
                  latestImage?.close(); latestImage = null
                  reader?.close(); reader = null
                  projection?.let {
                      try { it.stop() } catch (_: Exception) {}
                  }
                  projection = null
                  try { videoPfd?.close() } catch (_: Exception) {}
                  videoPfd = null
                  videoUri?.let { uri ->
                      if (deleteFile) {
                          contentResolver.delete(uri, null, null)
                      } else {
                          val v = ContentValues().apply { put(MediaStore.Video.Media.IS_PENDING, 0) }
                          contentResolver.update(uri, v, null, null)
                      }
                  }
                  videoUri = null
              }
          
              private fun stopSelfClean() {
                  mode = Mode.IDLE
                  stopForeground(STOP_FOREGROUND_REMOVE)
                  stopSelf()
              }
          
              // ---------------------------------------------------------------- screenshot
          
              private fun takeScreenshot(intent: Intent) {
                  try {
                      val mp = obtainProjection(intent) ?: throw IllegalStateException("projection 없음")
                      projection = mp
                      @Suppress("DEPRECATION")
                      val metrics = DisplayMetrics().also {
                          (getSystemService(Context.WINDOW_SERVICE) as WindowManager).defaultDisplay.getRealMetrics(it)
                      }
                      val w = metrics.widthPixels
                      val h = metrics.heightPixels
                      val ir = ImageReader.newInstance(w, h, PixelFormat.RGBA_8888, 3)
                      reader = ir
                      ir.setOnImageAvailableListener({ rd ->
                          val img = rd.acquireLatestImage() ?: return@setOnImageAvailableListener
                          latestImage?.close()
                          latestImage = img
                      }, main)
                      virtualDisplay = mp.createVirtualDisplay(
                          "ScreenCaptureShot", w, h, metrics.densityDpi,
                          DisplayManager.VIRTUAL_DISPLAY_FLAG_AUTO_MIRROR, ir.surface, null, null
                      )
                      // 권한 다이얼로그가 사라질 시간을 주고 가장 최근 프레임을 저장
                      main.postDelayed({ saveScreenshotOneshot(w, h, retry = true) }, 600)
                  } catch (e: Exception) {
                      cleanup(deleteFile = false)
                      publish(false, "스크린샷 실패: ${e.message}")
                      stopSelfClean()
                  }
              }
          
              private fun saveScreenshotOneshot(w: Int, h: Int, retry: Boolean) {
                  val img = latestImage
                  if (img == null) {
                      if (retry) main.postDelayed({ saveScreenshotOneshot(w, h, false) }, 600)
                      else { cleanup(false); publish(false, "스크린샷 실패: 프레임을 받지 못했습니다"); stopSelfClean() }
                      return
                  }
                  saveImage(img, w, h, keepAlive = false)
              }
          
              /**
               * ImageReader 프레임을 투명도(알파 채널)까지 그대로 보존한 PNG 로 저장한다.
               * keepAlive=true 면(퀵캡처) 캡처 화면을 안 끄고 계속 둔다.
               */
              private fun saveImage(img: Image?, w: Int, h: Int, keepAlive: Boolean) {
                  if (img == null) {
                      publish(false, "스크린샷 실패: 프레임을 받지 못했습니다")
                      if (!keepAlive) { cleanup(false); stopSelfClean() }
                      return
                  }
                  try {
                      val plane = img.planes[0]
                      val rowPixels = plane.rowStride / plane.pixelStride
                      val full = Bitmap.createBitmap(rowPixels, h, Bitmap.Config.ARGB_8888)
                      full.copyPixelsFromBuffer(plane.buffer)
                      val bmp = if (rowPixels != w) Bitmap.createBitmap(full, 0, 0, w, h) else full
          
                      val values = ContentValues().apply {
                          put(MediaStore.Images.Media.DISPLAY_NAME, "Screenshot_${stamp()}.png")
                          put(MediaStore.Images.Media.MIME_TYPE, "image/png")
                          put(MediaStore.Images.Media.RELATIVE_PATH, "Pictures/ScreenCapture")
                          put(MediaStore.Images.Media.IS_PENDING, 1)
                      }
                      val uri = contentResolver.insert(MediaStore.Images.Media.EXTERNAL_CONTENT_URI, values)
                          ?: throw IllegalStateException("파일 생성 실패")
                      // PNG 는 알파 채널을 그대로 보존한다. 화면 자체가 불투명해서 실제로는 완전 불투명 PNG가 되지만,
                      // 투명 레이어가 섞인 WebView/오버레이 등 일부 뷰는 알파가 살아서 저장될 수 있다.
                      contentResolver.openOutputStream(uri)!!.use { bmp.compress(Bitmap.CompressFormat.PNG, 100, it) }
                      contentResolver.update(uri, ContentValues().apply { put(MediaStore.Images.Media.IS_PENDING, 0) }, null, null)
                      publish(false, "스크린샷 저장됨: Pictures/ScreenCapture (${w}x$h PNG)")
                  } catch (e: Exception) {
                      publish(false, "스크린샷 실패: ${e.message}")
                  }
                  if (!keepAlive) {
                      cleanup(false)
                      stopSelfClean()
                  }
              }
          
              // ---------------------------------------------------------------- misc
          
              // 밀리초까지 넣어서 빠른 연속 캡처(퀵캡처 연타 등)에서 파일명이 겹치는 것을 막는다.
              private fun stamp() = SimpleDateFormat("yyyyMMdd_HHmmss_SSS", Locale.US).format(Date())
          
              private fun publish(recording: Boolean, message: String) {
                  isRecording = recording
                  main.post { listener?.invoke(recording, message) }
              }
          
              override fun onDestroy() {
                  cleanup(deleteFile = false)
                  super.onDestroy()
              }
          
              companion object {
                  const val ACTION_RECORD = "com.example.screencapture.RECORD"
                  const val ACTION_SCREENSHOT = "com.example.screencapture.SCREENSHOT"
                  const val ACTION_QUICK_START = "com.example.screencapture.QUICK_START"
                  const val ACTION_QUICK_CAPTURE = "com.example.screencapture.QUICK_CAPTURE"
                  const val ACTION_QUICK_STOP = "com.example.screencapture.QUICK_STOP"
                  const val ACTION_STOP = "com.example.screencapture.STOP"
                  const val EXTRA_CODE = "code"
                  const val EXTRA_DATA = "data"
                  const val EXTRA_MIC = "mic"
                  private const val CHANNEL = "capture"
          
                  @Volatile var isRecording = false
                  @Volatile var isQuickActive = false
                  var listener: ((Boolean, String) -> Unit)? = null
          
                  /** 화면 아무 곳에서나 바로 캡처: 떠 있는 캡처 화면에 한 장만 찍으라고 신호를 보낸다. */
                  fun captureNow(ctx: Context) {
                      ctx.startService(Intent(ctx, CaptureService::class.java).setAction(ACTION_QUICK_CAPTURE))
                  }
          
                  fun stopQuick(ctx: Context) {
                      ctx.startService(Intent(ctx, CaptureService::class.java).setAction(ACTION_QUICK_STOP))
                  }
              }
          }
          __SC_EOF__
          mkdir -p "$(dirname 'app/src/main/java/com/example/screencapture/FloatingButtonService.kt')"
          cat > 'app/src/main/java/com/example/screencapture/FloatingButtonService.kt' <<'__SC_EOF__'
          package com.example.screencapture
          
          import android.app.Service
          import android.content.Context
          import android.content.Intent
          import android.content.SharedPreferences
          import android.graphics.Color
          import android.graphics.PixelFormat
          import android.graphics.drawable.GradientDrawable
          import android.os.Build
          import android.os.Handler
          import android.os.IBinder
          import android.os.Looper
          import android.view.Gravity
          import android.view.MotionEvent
          import android.view.View
          import android.view.WindowManager
          import android.widget.FrameLayout
          import android.widget.ImageView
          import kotlin.math.abs
          
          /**
           * 화면 어디에 있든 누르면 바로 한 장 찍히는 투명한 동그라미 버튼.
           * CaptureService 가 이미 켜 둔 캡처 화면에 신호만 보내므로 탭할 때마다
           * 권한 다이얼로그가 다시 뜨지 않고, 보고 있던 화면이 그대로 찍힌다.
           */
          class FloatingButtonService : Service() {
          
              private lateinit var wm: WindowManager
              private lateinit var prefs: SharedPreferences
              private var bubble: View? = null
              private var recDot: View? = null
              private val main = Handler(Looper.getMainLooper())
          
              /** CaptureService 의 현재 녹화 상태를 주기적으로 확인해서 작은 빨간 점으로 표시한다. */
              private val statusPoll = object : Runnable {
                  override fun run() {
                      recDot?.visibility = if (CaptureService.isRecording) View.VISIBLE else View.GONE
                      main.postDelayed(this, 800)
                  }
              }
          
              override fun onBind(intent: Intent?): IBinder? = null
          
              override fun onCreate() {
                  super.onCreate()
                  wm = getSystemService(Context.WINDOW_SERVICE) as WindowManager
                  prefs = getSharedPreferences("floating_button", MODE_PRIVATE)
                  addBubble()
                  main.post(statusPoll)
              }
          
              private fun addBubble() {
                  val density = resources.displayMetrics.density
                  val size = (56 * density).toInt()
                  val dotSize = (14 * density).toInt()
          
                  val icon = ImageView(this).apply {
                      setImageResource(android.R.drawable.ic_menu_camera)
                      setColorFilter(Color.WHITE)
                      val pad = (14 * density).toInt()
                      setPadding(pad, pad, pad, pad)
                  }
                  val circle = GradientDrawable().apply {
                      shape = GradientDrawable.OVAL
                      setColor(0x662196F3) // 투명한 파란 원 (ARGB, 알파 0x66)
                  }
                  val dot = ImageView(this).apply {
                      background = GradientDrawable().apply {
                          shape = GradientDrawable.OVAL
                          setColor(0xFFE53935.toInt()) // 녹화 중 표시용 빨간 점
                      }
                      visibility = View.GONE
                  }
                  recDot = dot
          
                  val container = FrameLayout(this).apply {
                      background = circle
                      addView(icon, FrameLayout.LayoutParams(FrameLayout.LayoutParams.MATCH_PARENT, FrameLayout.LayoutParams.MATCH_PARENT))
                      addView(
                          dot,
                          FrameLayout.LayoutParams(dotSize, dotSize, Gravity.TOP or Gravity.END)
                      )
                  }
          
                  val overlayType =
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY
                      else @Suppress("DEPRECATION") WindowManager.LayoutParams.TYPE_PHONE
          
                  // 마지막으로 저장해 둔 위치가 있으면 그걸, 없으면 화면 오른쪽 위 기본 위치를 쓴다.
                  val defaultX = resources.displayMetrics.widthPixels - size - (12 * density).toInt()
                  val defaultY = (120 * density).toInt()
                  val params = WindowManager.LayoutParams(
                      size, size, overlayType,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS,
                      PixelFormat.TRANSLUCENT
                  ).apply {
                      gravity = Gravity.TOP or Gravity.START
                      x = prefs.getInt(PREF_X, defaultX)
                      y = prefs.getInt(PREF_Y, defaultY)
                  }
          
                  var downX = 0f; var downY = 0f
                  var startX = 0; var startY = 0
                  var moved = false
          
                  container.setOnTouchListener { v, ev ->
                      when (ev.action) {
                          MotionEvent.ACTION_DOWN -> {
                              downX = ev.rawX; downY = ev.rawY
                              startX = params.x; startY = params.y
                              moved = false
                              true
                          }
                          MotionEvent.ACTION_MOVE -> {
                              val dx = (ev.rawX - downX).toInt()
                              val dy = (ev.rawY - downY).toInt()
                              if (abs(dx) > 8 || abs(dy) > 8) moved = true
                              params.x = startX + dx
                              params.y = startY + dy
                              wm.updateViewLayout(v, params)
                              true
                          }
                          MotionEvent.ACTION_UP -> {
                              if (!moved) {
                                  // 짧게 탭: 캡처. 길게 눌렀다 떼면(드래그 없이) 버튼 끄기.
                                  CaptureService.captureNow(this@FloatingButtonService)
                                  v.performClick()
                              } else {
                                  // 드래그로 옮긴 위치를 기억해 뒀다가 다음에 켤 때 그대로 띄운다.
                                  prefs.edit().putInt(PREF_X, params.x).putInt(PREF_Y, params.y).apply()
                              }
                              true
                          }
                          else -> false
                      }
                  }
                  container.setOnLongClickListener {
                      CaptureService.stopQuick(this@FloatingButtonService)
                      true
                  }
          
                  wm.addView(container, params)
                  bubble = container
              }
          
              override fun onDestroy() {
                  main.removeCallbacks(statusPoll)
                  bubble?.let { runCatching { wm.removeView(it) } }
                  bubble = null
                  recDot = null
                  super.onDestroy()
              }
          
              companion object {
                  private const val PREF_X = "x"
                  private const val PREF_Y = "y"
          
                  fun start(ctx: Context) {
                      ctx.startService(Intent(ctx, FloatingButtonService::class.java))
                  }
          
                  fun stop(ctx: Context) {
                      ctx.stopService(Intent(ctx, FloatingButtonService::class.java))
                  }
              }
          }
          __SC_EOF__
