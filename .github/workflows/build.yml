              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
          
                  val pad = (24 * resources.displayMetrics.density).toInt()
                  val root = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      gravity = Gravity.CENTER
                      setPadding(pad, pad, pad, pad)
                      setBackgroundColor(Color.parseColor("#121212"))
                  }
          
                  root.addView(TextView(this).apply {
                      text = "ScreenCapture"
                      textSize = 28f
                      setTextColor(Color.WHITE)
                      gravity = Gravity.CENTER
                  })
          
                  status = TextView(this).apply {
                      text = "대기 중\n최고 화질: 네이티브 해상도 · HEVC · 최대 60fps"
                      setTextColor(Color.LTGRAY)
                      gravity = Gravity.CENTER
                      setPadding(0, pad, 0, pad)
                  }
                  root.addView(status)
          
                  micSwitch = Switch(this).apply {
                      text = "마이크 녹음 (AAC 320kbps)"
                      setTextColor(Color.WHITE)
                  }
                  root.addView(micSwitch)
          
                  recordBtn = Button(this).apply {
                      text = "녹화 시작"
                      setOnClickListener { onRecordClicked() }
                  }
                  root.addView(recordBtn)
          
                  root.addView(Button(this).apply {
                      text = "스크린샷 (PNG 무손실)"
                      setOnClickListener { start(CaptureService.ACTION_SCREENSHOT) }
                  })
          
                  root.addView(TextView(this).apply {
                      text = "빠른 캡처 버튼: 화면 위에 투명한 동그라미를 띄워두고\n아무 화면에서나 탭 한 번으로 바로 찍습니다 (길게 누르면 끄기)"
                      setTextColor(Color.GRAY)
                      textSize = 12f
                      gravity = Gravity.CENTER
                      setPadding(0, pad, 0, (pad * 0.3f).toInt())
                  })
          
                  quickSwitch = Switch(this).apply {
                      text = "빠른 캡처 버튼"
                      setTextColor(Color.WHITE)
                      setOnCheckedChangeListener { _, checked ->
                          if (checked) requestQuickCapture() else {
                              startService(Intent(this@MainActivity, CaptureService::class.java).setAction(CaptureService.ACTION_QUICK_STOP))
                          }
                      }
                  }
                  root.addView(quickSwitch)
          
                  batteryBtn = Button(this).apply {
                      setOnClickListener { requestIgnoreBatteryOptimization() }
                  }
                  root.addView(batteryBtn)
                  root.addView(TextView(this).apply {
                      text = "중지 버튼을 누르기 전엔 녹화가 끊기지 않도록, 배터리 최적화에서\n이 앱을 제외해 두는 걸 권장합니다. 기기 제조사별 \"자동 실행/절전 모드\"\n설정도 따로 있다면 거기서도 허용해 주세요."
                      setTextColor(Color.GRAY)
                      textSize = 12f
                      gravity = Gravity.CENTER
                      setPadding(0, (pad * 0.3f).toInt(), 0, 0)
                  })
          
                  setContentView(root)
              }
          
              override fun onResume() {
                  super.onResume()
                  CaptureService.listener = { recording, msg ->
                      status.text = msg
                      recordBtn.text = if (recording) "녹화 중지" else "녹화 시작"
                      quickSwitch.isChecked = CaptureService.isQuickActive
                  }
                  recordBtn.text = if (CaptureService.isRecording) "녹화 중지" else "녹화 시작"
                  quickSwitch.isChecked = CaptureService.isQuickActive
                  refreshBatteryButton()
              }
          
              private fun refreshBatteryButton() {
                  val pm = getSystemService(Context.POWER_SERVICE) as PowerManager
                  val exempt = pm.isIgnoringBatteryOptimizations(packageName)
                  batteryBtn.text = if (exempt) "배터리 최적화 제외됨 ✓" else "배터리 최적화 제외 요청"
                  batteryBtn.isEnabled = !exempt
              }
          
              private fun requestIgnoreBatteryOptimization() {
                  startActivity(Intent(Settings.ACTION_REQUEST_IGNORE_BATTERY_OPTIMIZATIONS, Uri.parse("package:$packageName")))
              }
          
              override fun onPause() {
                  CaptureService.listener = null
                  super.onPause()
              }
          
              private fun requestQuickCapture() {
                  if (Settings.canDrawOverlays(this)) {
                      start(CaptureService.ACTION_QUICK_START)
                  } else {
                      status.text = "다음 화면에서 \"다른 앱 위에 표시\"를 허용해 주세요"
                      overlayPermLauncher.launch(
                          Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION, Uri.parse("package:$packageName"))
                      )
                  }
              }
          
              private fun onRecordClicked() {
                  if (CaptureService.isRecording) {
                      startService(Intent(this, CaptureService::class.java).setAction(CaptureService.ACTION_STOP))
                  } else {
                      start(CaptureService.ACTION_RECORD)
                  }
              }
          
              private fun start(action: String) {
                  pendingAction = action
                  val need = mutableListOf<String>()
                  if (Build.VERSION.SDK_INT >= 33 &&
                      checkSelfPermission(Manifest.permission.POST_NOTIFICATIONS) != android.content.pm.PackageManager.PERMISSION_GRANTED
                  ) need += Manifest.permission.POST_NOTIFICATIONS
                  if (action == CaptureService.ACTION_RECORD && micSwitch.isChecked &&
                      checkSelfPermission(Manifest.permission.RECORD_AUDIO) != android.content.pm.PackageManager.PERMISSION_GRANTED
                  ) need += Manifest.permission.RECORD_AUDIO
                  if (need.isEmpty()) launchProjection() else permLauncher.launch(need.toTypedArray())
              }
          
              private fun launchProjection() {
                  val mpm = getSystemService(Context.MEDIA_PROJECTION_SERVICE) as MediaProjectionManager
                  projectionLauncher.launch(mpm.createScreenCaptureIntent())
              }
          }
          __SC_EOF__

