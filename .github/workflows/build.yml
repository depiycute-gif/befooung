          import android.widget.Switch
          import android.widget.TextView
          import androidx.activity.ComponentActivity
          import androidx.activity.result.contract.ActivityResultContracts
          
          class MainActivity : ComponentActivity() {
          
              private lateinit var status: TextView
              private lateinit var recordBtn: Button
              private lateinit var micSwitch: Switch
              private lateinit var quickSwitch: Switch
              private lateinit var batteryBtn: Button
              private var pendingAction: String? = null
          
              private val projectionLauncher =
                  registerForActivityResult(ActivityResultContracts.StartActivityForResult()) { res ->
                      val action = pendingAction ?: return@registerForActivityResult
                      pendingAction = null
                      val data = res.data
                      if (res.resultCode != RESULT_OK || data == null) {
                          status.text = "화면 캡처 권한이 거부되었습니다"
                          if (action == CaptureService.ACTION_QUICK_START) quickSwitch.isChecked = false
                          return@registerForActivityResult
                      }
                      val i = Intent(this, CaptureService::class.java)
                          .setAction(action)
                          .putExtra(CaptureService.EXTRA_CODE, res.resultCode)
                          .putExtra(CaptureService.EXTRA_DATA, data)
                          .putExtra(CaptureService.EXTRA_MIC, micSwitch.isChecked)
                      startForegroundService(i)
                      if (action == CaptureService.ACTION_QUICK_START) FloatingButtonService.start(this)
                  }
          
              private val permLauncher =
                  registerForActivityResult(ActivityResultContracts.RequestMultiplePermissions()) {
                      // 거부돼도 진행: 알림은 없어도 동작, 마이크는 서비스에서 다시 확인
                      pendingAction?.let { launchProjection() }
                  }
          
              private val overlayPermLauncher =
                  registerForActivityResult(ActivityResultContracts.StartActivityForResult()) {
